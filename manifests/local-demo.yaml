apiVersion: v1
kind: Namespace
metadata:
  name: local-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-demo
  namespace: local-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-demo
    spec:
      containers:
        - name: web
          image: docker.io/library/apple-container-local-demo:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: local-demo
  namespace: local-demo
spec:
  selector:
    app.kubernetes.io/name: local-demo
  ports:
    - name: http
      port: 80
      targetPort: http
